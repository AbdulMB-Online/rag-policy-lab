name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate corpus and run tests without LLM calls
        run: |
          python -B scripts/validate_corpus.py
          python -B -m pytest -q -s -k 'not live' -p no:cacheprovider

      - name: Check minimal embed-store-retrieve loop
        run: python -B scripts/minimal_retrieval.py

      - name: Index the full corpus
        run: python -B -m rag.pipeline index

      - name: Compare vector and hybrid retrieval without LLM calls
        run: |
          python -B - <<'PY'
          from rag.retrieval import hybrid_retrieve
          from rag.retrieval import retrieve

          cases = [
              ("What is the daily meal reimbursement limit during business travel?", "expense-reimbursement", "EXP-03.1"),
              ("How many hours of PTO do I earn for each completed month?", "pto", "PTO-03.1"),
              ("What should I do if I lose my company laptop?", "information-security", "SEC-04"),
              ("How many days can I work remotely per calendar week?", "remote-work", "RW-03.1"),
          ]
          for search in (retrieve, hybrid_retrieve):
              for question, policy, section in cases:
                  hits = search(question, top_k=4)
                  assert any(
                      hit["metadata"]["policy_id"] == policy
                      and hit["metadata"]["section_id"] == section
                      for hit in hits
                  ), f"{search.__name__}: expected {policy} section {section} in the top 4"
                  if policy == "remote-work":
                      versions = {
                          hit["metadata"]["version"] for hit in hits
                          if hit["metadata"]["policy_id"] == policy
                          and hit["metadata"]["section_id"] == section
                      }
                      assert versions == {"1.0", "2.0"}, "Both Remote Work versions must remain retrievable"
                  print(f"PASS [{search.__name__}]: {question}")

          def table_rank(hits):
              return next((rank for rank, hit in enumerate(hits, 1)
                           if hit["metadata"].get("table_id") == "PTO-T01"), None)

          vector_rank = table_rank(retrieve("PTO-T01", top_k=4))
          hybrid_rank = table_rank(hybrid_retrieve("PTO-T01", top_k=4))
          assert hybrid_rank == 1, "Hybrid should select the requested PTO table first"
          assert vector_rank is None or hybrid_rank < vector_rank, "Review the PTO-T01 improvement demonstration"
          print(f"PASS PTO-T01: vector rank {vector_rank or '>4'}; hybrid rank {hybrid_rank}")
          print(f"Hit@1: vector={int(vector_rank == 1)}, hybrid={int(hybrid_rank == 1)}")
          print(f"Hit@4: vector={int(vector_rank is not None)}, hybrid={int(hybrid_rank is not None)}")
          PY

      - name: Check cross-encoder reranking without LLM calls
        run: |
          python -B - <<'PY'
          from math import isfinite

          from rag.retrieval import hybrid_retrieve
          from rag.reranking import MODEL, rerank

          controls = [
              {"id": "unrelated", "text": "Company laptops must lock automatically after five minutes.", "metadata": {}},
              {"id": "relevant", "text": "Employees earn 10 hours of PTO for each completed month of employment.", "metadata": {}},
          ]
          best = rerank("How many hours of PTO do I earn each month?", controls, top_k=1)
          assert best[0]["id"] == "relevant", "Reranker must promote the relevant passage"
          print(f"PASS [{MODEL}]: relevant passage promoted from rank 2 to 1")

          cases = [
              ("What is the daily meal reimbursement limit during business travel?", "expense-reimbursement", "EXP-03.1"),
              ("How many hours of PTO do I earn for each completed month?", "pto", "PTO-03.1"),
              ("What should I do if I lose my company laptop?", "information-security", "SEC-04"),
          ]
          for question, policy, section in cases:
              candidates = hybrid_retrieve(question, top_k=12)
              hits = rerank(question, candidates, top_k=4)
              assert len(hits) == 4
              assert {hit["id"] for hit in hits} <= {hit["id"] for hit in candidates}
              scores = [hit["rerank_score"] for hit in hits]
              assert all(isfinite(score) for score in scores)
              assert scores == sorted(scores, reverse=True)

              def source_rank(items):
                  return next((rank for rank, hit in enumerate(items, 1)
                               if hit["metadata"]["policy_id"] == policy
                               and hit["metadata"]["section_id"] == section), None)

              before = source_rank(candidates[:4])
              after = source_rank(hits)
              assert after is not None, f"Expected {policy} section {section} in reranked top 4"
              print(f"PASS: {question} | hybrid rank {before or '>4'}; reranked rank {after}")
          PY

      - name: Evaluate eight live Foundry answers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: >-
          python -B -m pytest tests/test_rag_integration.py::test_live_answers
          -q -s -rs --tb=short -p no:cacheprovider
